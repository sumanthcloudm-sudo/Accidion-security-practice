name: Infrastructure PR Validation

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@<REVIEWED_FULL_COMMIT_SHA>
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@<REVIEWED_FULL_COMMIT_SHA>
        with:
          tofu_version: "1.13.2"

      - name: Check formatting
        working-directory: infra
        run: tofu fmt -check -recursive

      - name: Initialize without remote backend
        working-directory: infra
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        working-directory: infra
        run: tofu validate -no-color

      - name: Install IaC scanner
        run: |
          python -m pip install checkov==<REVIEWED_VERSION>

      - name: Scan infrastructure
        run: checkov -d infra --framework terraform
