name: Infrastructure PR Validation
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v3
        with:
          tofu_version: "1.13.2"

      - name: Check formatting
        working-directory: infra
        run: |
          find . -type f \( -name '*.tf' -o -name '*.tfvars' \) -print0 | xargs -0 -r tofu fmt -check

      - name: Initialize without remote backend
        working-directory: infra
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        working-directory: infra
        run: tofu validate -no-color

      - name: Install IaC scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Scan infrastructure
        run: checkov -d infra --framework terraform
